  url_launcher: ^6.3.3
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true


    