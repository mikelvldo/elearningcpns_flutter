name: elearning_app
description: "Simple E-Learning Platform (Flutter, GetX, MVVM)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  get: ^4.6.6
  flutter_screenutil: ^5.9.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
